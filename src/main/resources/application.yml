server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: gym-booking-backend
  web:
    locale: en
    locale-resolver: fixed

app:
  time-zone: Asia/Almaty
  jwt:
    secret: dev-only-secret-change-me-0123456789abcdef
    access-ttl: 15m
    refresh-ttl: 30d
    qr-ttl: 60s
  jobs:
    enabled: true
